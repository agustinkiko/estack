<text class="f" x="40" y="98" font-size="34" font-weight="800" fill="#FFFFFF">One rule set.</text>
<text class="f" x="40" y="140" font-size="34" font-weight="800" fill="#FFFFFF">Every repo. Better each lap.</text>
<text class="f" x="40" y="186" font-size="17" fill="#FFFFFF" fill-opacity="0.82">1 plugin · 15 skills · 1 rules file · 3 files per repo</text>
