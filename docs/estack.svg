<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" role="img" aria-labelledby="t d">
<title id="t">estack at a glance</title>
<desc id="d">estack gives every coding agent session the same rules and skills. Each repo adds its own facts. Every code change follows one line: restate, start, build, prove, ship, deploy. Lessons go back into estack so every repo improves.</desc>
