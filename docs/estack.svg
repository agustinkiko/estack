<text class="f" x="778" y="760" font-size="15" font-weight="600" fill="#132031">1. Ship a PR<animate attributeName="fill" calcMode="discrete" values="#6E46C9;#132031" keyTimes="0;0.2" dur="10s" repeatCount="indefinite"/></text>
<text class="f" x="778" y="782" font-size="15" font-weight="600" fill="#132031">2. Notice: review, bot, incident, repeat fix<animate attributeName="fill" calcMode="discrete" values="#132031;#6E46C9;#132031" keyTimes="0;0.20;0.40" dur="10s" repeatCount="indefinite"/></text>
<text class="f" x="778" y="804" font-size="15" font-weight="600" fill="#132031">3. Route it to one home in estack<animate attributeName="fill" calcMode="discrete" values="#132031;#6E46C9;#132031" keyTimes="0;0.40;0.60" dur="10s" repeatCount="indefinite"/></text>
<text class="f" x="778" y="826" font-size="15" font-weight="600" fill="#132031">4. Run scripts/check.sh, bump version<animate attributeName="fill" calcMode="discrete" values="#132031;#6E46C9;#132031" keyTimes="0;0.60;0.80" dur="10s" repeatCount="indefinite"/></text>
<text class="f" x="778" y="848" font-size="15" font-weight="600" fill="#132031">5. Push: every repo gets it next session<animate attributeName="fill" calcMode="discrete" values="#132031;#6E46C9;#132031" keyTimes="0;0.80;1.00" dur="10s" repeatCount="indefinite"/></text>
</svg>
